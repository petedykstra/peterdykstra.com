*{box-sizing:border-box;margin:0;padding:0}

h2{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:2.5rem 0 .5rem}
ul{list-style:none}
li{border-top:1px solid var(--line)}
li:last-child{border-bottom:1px solid var(--line)}
li>a,li>span{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem 0}
a{color:var(--link);text-decoration:none}
a:hover .n,a:focus-visible .n,.mail:hover{text-decoration:underline;text-underline-offset:.2em}
a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.u{color:var(--mute);font-size:.875em;white-space:nowrap}
span .n{color:var(--mute)}
.n{display:inline-flex;align-items:center;gap:.6em}
svg{width:1.05em;height:1.05em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.r{transform:rotate(-45deg)}
