name: Deploy to peterdykstra.com

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload public/ over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          server-dir: ./public_html/
          # Only uploads changed files; never deletes anything already on the server
          # (so /photos and other existing folders are left alone).
          exclude: |
            **/.DS_Store
            **/.git*
